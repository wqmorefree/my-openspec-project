<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统技术资产</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== 全局重置 & 变量 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --sidebar-width: 220px;
            --header-height: 64px;
            --primary: #2b5fd9;
            --primary-light: #e8edfb;
            --primary-dark: #1a3f8c;
            --primary-gradient: linear-gradient(135deg, #2b5fd9 0%, #1a4cbf 100%);
            --sidebar-bg: #0f1825;
            --sidebar-hover: #1e2d44;
            --bg-main: #f2f5fa;
            --card-bg: #ffffff;
            --border-color: #e6ecf3;
            --text-main: #0f1825;
            --text-secondary: #4a5b6e;
            --text-light: #8a9bb0;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.10);
            --radius: 12px;
            --transition: 0.25s cubic-bezier(0.2, 0, 0, 1);
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            font-family: var(--font-family);
            background: var(--bg-main);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #eef0f4; }
        ::-webkit-scrollbar-thumb { background: #c8d0dc; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8b4c4; }

        /* ===== 侧边栏 ===== */
        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--sidebar-bg);
            color: #b0c4dd;
            position: fixed;
            top: 0; left: 0;
            display: flex;
            flex-direction: column;
            z-index: 1000;
            transition: transform var(--transition);
            overflow-y: auto;
            overflow-x: hidden;
            box-shadow: 2px 0 20px rgba(0, 0, 0, 0.08);
        }
        .sidebar-brand {
            padding: 18px 22px;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: var(--header-height);
            background: rgba(255, 255, 255, 0.02);
        }
        .sidebar-brand i {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 24px;
        }
        .sidebar-brand span { letter-spacing: 0.3px; -webkit-text-fill-color: #fff; }

        .sidebar-menu { padding: 20px 0 30px; flex: 1; }
        .sidebar-menu .menu-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #4a6180;
            padding: 12px 22px 6px;
            font-weight: 500;
        }
        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 22px;
            color: #a0b6d4;
            text-decoration: none;
            font-size: 14px;
            transition: var(--transition);
            border-left: 3px solid transparent;
            cursor: pointer;
            margin: 2px 8px;
            border-radius: 6px;
        }
        .sidebar-menu a i {
            width: 18px;
            font-size: 15px;
            text-align: center;
            color: #4a6180;
        }
        .sidebar-menu a:hover,
        .sidebar-menu a.active {
            background: var(--sidebar-hover);
            color: #fff;
            border-left-color: var(--primary);
        }
        .sidebar-menu a:hover i,
        .sidebar-menu a.active i { color: var(--primary); }

        /* ===== 主内容 ===== */
        .main {
            margin-left: var(--sidebar-width);
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ===== 顶部导航 ===== */
        .topbar {
            height: var(--header-height);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(230, 236, 243, 0.6);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .topbar-left { display: flex; align-items: center; gap: 18px; }
        .topbar-left .breadcrumb { font-size: 14px; color: var(--text-secondary); }
        .topbar-left .breadcrumb span { color: var(--text-main); font-weight: 500; }
        .topbar-left .hamburger {
            display: none;
            background: none;
            border: none;
            font-size: 20px;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
        }
        .topbar-right { display: flex; align-items: center; gap: 20px; }
        .topbar-right .user {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: var(--text-secondary);
            padding: 4px 12px 4px 4px;
            border-radius: 30px;
            background: var(--bg-main);
            cursor: default;
        }
        .topbar-right .user .avatar {
            width: 34px; height: 34px;
            border-radius: 50%;
            background: var(--primary-gradient);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 2px 8px rgba(43, 95, 217, 0.25);
        }
        .topbar-right .notification {
            position: relative;
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            width: 36px; height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: var(--transition);
        }
        .topbar-right .notification:hover { background: var(--bg-main); color: var(--text-main); }
        .topbar-right .notification .dot {
            position: absolute;
            top: 6px; right: 6px;
            width: 8px; height: 8px;
            background: #e74c3c;
            border-radius: 50%;
            border: 2px solid #fff;
        }

        /* ===== 页面内容 ===== */
        .page-content { padding: 28px 32px 40px; flex: 1; }

        /* ============================================================
           系统列表页
           ============================================================ */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }
        .page-header .title-group h1 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }
        .page-header .title-group .sub {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .action-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .action-bar .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 18px;
            border: none;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            box-shadow: var(--shadow-sm);
            letter-spacing: 0.2px;
            background: var(--card-bg);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }
        .action-bar .btn i { font-size: 14px; }
        .action-bar .btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .action-bar .btn-primary {
            background: var(--primary-gradient);
            color: #fff;
            border: none;
            box-shadow: 0 4px 12px rgba(43, 95, 217, 0.30);
        }
        .action-bar .btn-primary:hover { box-shadow: 0 6px 20px rgba(43, 95, 217, 0.40); }
        .action-bar .btn-success {
            background: #1d9b5c;
            color: #fff;
            border: none;
            box-shadow: 0 4px 12px rgba(29, 155, 92, 0.25);
        }
        .action-bar .btn-success:hover { background: #15804b; box-shadow: 0 6px 18px rgba(29, 155, 92, 0.35); }
        .action-bar .btn-export {
            background: var(--card-bg);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }
        .action-bar .btn-export:hover { background: var(--bg-main); border-color: #b8c6d8; }
        .action-bar .btn-danger-outline {
            background: transparent;
            color: #dc3545;
            border: 1px solid #dc3545;
        }
        .action-bar .btn-danger-outline:hover { background: #fde8e8; border-color: #dc3545; }

        /* ===== 工具栏 ===== */
        .toolbar {
            background: var(--card-bg);
            padding: 14px 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            margin-bottom: 22px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 16px;
            border: 1px solid rgba(230, 236, 243, 0.4);
        }
        .toolbar .search-box {
            flex: 1;
            min-width: 200px;
            display: flex;
            align-items: center;
            background: var(--bg-main);
            border-radius: 30px;
            padding: 0 16px;
            border: 1px solid transparent;
            transition: var(--transition);
        }
        .toolbar .search-box:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(43, 95, 217, 0.08);
            background: var(--card-bg);
        }
        .toolbar .search-box i { color: var(--text-light); font-size: 14px; }
        .toolbar .search-box input {
            border: none;
            background: transparent;
            padding: 9px 12px;
            font-size: 14px;
            width: 100%;
            outline: none;
            font-family: inherit;
            color: var(--text-main);
        }
        .toolbar .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .toolbar .filters select {
            padding: 7px 14px;
            border: 1px solid var(--border-color);
            border-radius: 30px;
            font-size: 13px;
            background: var(--card-bg);
            color: var(--text-main);
            font-family: inherit;
            outline: none;
            transition: var(--transition);
            min-width: 120px;
        }
        .toolbar .filters select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(43, 95, 217, 0.06);
        }
        .toolbar .btn-reset {
            padding: 7px 16px;
            border: 1px solid var(--border-color);
            border-radius: 30px;
            background: var(--card-bg);
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .toolbar .btn-reset:hover { background: var(--bg-main); border-color: #b8c6d8; }

        /* ===== 系统卡片网格 ===== */
        .system-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 18px;
        }
        .system-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px 22px 18px;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(230, 236, 243, 0.5);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
        }
        .system-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary);
        }
        .system-card .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
        }
        .system-card .sys-name { font-size: 17px; font-weight: 600; color: var(--text-main); }
        .system-card .sys-code { font-size: 13px; color: var(--text-light); margin-bottom: 8px; }
        .system-card .sys-status {
            font-size: 12px;
            padding: 2px 12px;
            border-radius: 30px;
            font-weight: 500;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .sys-status.status-building { background: #e8f0fd; color: #1a5fb0; }
        .sys-status.status-online { background: #e8f5e9; color: #1d7a3c; }
        .sys-status.status-offline { background: #fde8e8; color: #b02a37; }
        .sys-status.status-maintaining { background: #fff3e0; color: #b7651a; }

        .system-card .sys-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 16px;
            font-size: 13px;
            color: var(--text-secondary);
            margin: 8px 0 12px;
        }
        .system-card .sys-meta span { display: flex; align-items: center; gap: 4px; }
        .system-card .sys-meta i { color: var(--text-light); font-size: 13px; width: 16px; }
        .system-card .card-actions {
            display: flex;
            gap: 6px;
            margin-top: 4px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
        }
        .system-card .card-actions .btn-sm {
            padding: 5px 14px;
            border: none;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .system-card .card-actions .btn-sm.view { background: var(--primary-light); color: var(--primary); }
        .system-card .card-actions .btn-sm.view:hover { background: var(--primary); color: #fff; }
        .system-card .card-actions .btn-sm.edit { background: var(--bg-main); color: var(--text-secondary); }
        .system-card .card-actions .btn-sm.edit:hover { background: #e2e8f0; }
        .system-card .card-actions .btn-sm.delete { background: #fde8e8; color: #b02a37; }
        .system-card .card-actions .btn-sm.delete:hover { background: #fcc; }

        /* ===== 表格 ===== */
        .table-wrapper {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            border: 1px solid rgba(230, 236, 243, 0.4);
        }
        .table-scroll { overflow-x: auto; padding: 0 4px 4px 4px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        table th {
            background: #f7faff;
            color: var(--text-secondary);
            font-weight: 600;
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1.5px solid var(--border-color);
            white-space: nowrap;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        table td {
            padding: 11px 16px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        table tr:last-child td { border-bottom: none; }
        table tr:hover td { background: #f8faff; }
        table td .tag {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 500;
            background: var(--primary-light);
            color: var(--primary);
        }
        table td .tag.env-prod { background: #fde8e8; color: #b02a37; }
        table td .tag.env-test { background: #e8f0fd; color: #1a5fb0; }
        table td .tag.env-dev { background: #e8f5e9; color: #1d7a3c; }

        .action-group { display: flex; gap: 4px; }
        .action-group .btn-icon {
            width: 30px; height: 30px;
            border: none;
            border-radius: 30px;
            background: transparent;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-secondary);
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .action-group .btn-icon:hover { background: var(--bg-main); }
        .action-group .btn-icon.view:hover { color: #1d9b5c; background: #e8f5e9; }
        .action-group .btn-icon.edit:hover { color: var(--primary); background: var(--primary-light); }
        .action-group .btn-icon.delete:hover { color: #dc3545; background: #fde8e8; }

        .table-footer {
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            font-size: 13px;
            color: var(--text-secondary);
            flex-wrap: wrap;
            gap: 10px;
            background: #fafcff;
        }
        .table-footer .pagination { display: flex; gap: 4px; align-items: center; }
        .table-footer .pagination button {
            padding: 5px 12px;
            border: 1px solid transparent;
            background: transparent;
            border-radius: 30px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-secondary);
            transition: var(--transition);
            font-family: inherit;
        }
        .table-footer .pagination button:hover:not(:disabled) { background: var(--bg-main); border-color: var(--border-color); }
        .table-footer .pagination button.active {
            background: var(--primary-gradient);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 2px 8px rgba(43, 95, 217, 0.25);
        }
        .table-footer .pagination button:disabled { opacity: 0.3; cursor: not-allowed; }

        /* ===== Tab 样式 ===== */
        .tabs-container {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 6px 12px;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
        }
        .tabs-container .tab-btn {
            padding: 6px 16px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
            background: transparent;
            color: var(--text-secondary);
            transition: var(--transition);
            font-weight: 400;
            white-space: nowrap;
        }
        .tabs-container .tab-btn:hover { background: var(--bg-main); color: var(--text-main); }
        .tabs-container .tab-btn.active {
            background: var(--primary-gradient);
            color: #fff;
            font-weight: 500;
        }

        /* ===== 返回链接 ===== */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--primary);
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            transition: var(--transition);
            background: none;
            border: none;
            font-family: inherit;
            padding: 4px 0;
        }
        .back-link:hover { color: var(--primary-dark); gap: 10px; }

        /* ===== 表格提示条 ===== */
        .table-hint {
            font-size: 12px;
            color: var(--text-light);
            background: #f7faff;
            padding: 6px 14px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 10px;
        }
        .table-hint i { color: var(--primary); }

        /* ============================================================
           架构图卡片
           ============================================================ */
        .arch-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 28px 32px 32px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            transition: box-shadow 0.25s ease;
        }
        .arch-card:hover { box-shadow: var(--shadow-md); }
        .arch-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .arch-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 600;
            color: var(--text-main);
        }
        .arch-title i {
            color: var(--primary);
            font-size: 20px;
            background: var(--primary-light);
            padding: 8px;
            border-radius: 10px;
        }
        .arch-header .arch-meta {
            font-size: 13px;
            color: var(--text-light);
            background: var(--bg-main);
            padding: 4px 14px;
            border-radius: 30px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .upload-area {
            border: 2px dashed #d0d8e6;
            border-radius: 14px;
            padding: 48px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            background: #fafcff;
            position: relative;
        }
        .upload-area:hover {
            border-color: var(--primary);
            background: #f0f5ff;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(43, 95, 217, 0.08);
        }
        .upload-area.dragover {
            border-color: var(--primary);
            background: var(--primary-light);
            box-shadow: 0 0 0 4px rgba(43, 95, 217, 0.12);
        }
        .upload-area .upload-icon {
            font-size: 48px;
            color: #b0c4dd;
            margin-bottom: 12px;
            display: block;
            transition: color 0.25s ease;
        }
        .upload-area:hover .upload-icon { color: var(--primary); }
        .upload-area .upload-title { font-size: 16px; font-weight: 600; color: var(--text-main); margin-bottom: 6px; }
        .upload-area .upload-hint { font-size: 14px; color: var(--text-secondary); margin-bottom: 4px; }
        .upload-area .upload-formats {
            font-size: 12px;
            color: var(--text-light);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-main);
            padding: 4px 14px;
            border-radius: 30px;
            margin-top: 8px;
        }
        .upload-area .upload-arrow {
            position: absolute;
            right: 24px; bottom: 20px;
            font-size: 20px;
            color: #d0d8e6;
            transition: all 0.25s ease;
        }
        .upload-area:hover .upload-arrow { color: var(--primary); transform: translateX(4px); }

        .image-preview {
            margin-top: 20px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            background: #fafcff;
            display: none;
        }
        .image-preview.show { display: block; }
        .image-preview img {
            width: 100%;
            max-height: 320px;
            object-fit: contain;
            display: block;
            background: #fff;
            padding: 8px;
        }
        .image-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 14px 16px;

            if (e.target === drawerOverlay) closeDrawer();
        });

        function getStatusClass(status) {
            const map = { '在建': 'status-building', '已上线': 'status-online', '已下线': 'status-offline', '维护中': 'status-maintaining' };
            return map[status] || 'status-building';
        }

        function getSystemById(id) { return systems.find(s => s.id === id); }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str).replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // ============================================================
        // 系统列表页
        // ============================================================
        function renderSystemList() {
            currentSystemId = null;
            breadcrumbTitle.textContent = '系统列表';

            sidebarLinks.forEach(a => {

            const keyword = document.getElementById('sysSearchInput')?.value?.toLowerCase() || '';

                return matchKeyword && matchDomain && matchStatus;

            if (filtered.length === 0) {

                                <div>

                                <span class="sys-status ${statusCls}">${sys.status}</span>

        // ============================================================
        // 系统详情页
        // ============================================================
        function renderSystemDetail(systemId, tabIndex = 0, page = 1) {
            const sys = getSystemById(systemId);
            if (!sys) { showToast('系统不存在', 'error'); renderSystemList(); return; }

            currentSystemId = systemId;
            currentTabIndex = tabIndex;
            currentTablePage = page;
            breadcrumbTitle.textContent = `${sys.name} · 技术信息`;

            sidebarLinks.forEach(a => { a.classList.toggle('active', a.dataset.page === 'tech-asset'); });

            const tab = TABS[tabIndex];
            if (!tab) return;

            const tabData = sys.techData[tab.key];
            const isArch = tabData && tabData.isArch;

            // 判断是否部署信息
            const isDeploy = tab.key === 'deploy';

            // 分页
            let allData = [];
            let fields = [];
            let total = 0;
            let totalPages = 1;
            let start = 0, end = 0;
            let pageData = [];

            if (!isArch && tabData) {
                fields = tabData.fields || [];
                allData = tabData.data || [];
                total = allData.length;
                totalPages = Math.max(1, Math.ceil(total / pageSize));
                if (page > totalPages) currentTablePage = totalPages;
                if (page < 1) currentTablePage = 1;
                start = (currentTablePage - 1) * pageSize;
                end = Math.min(start + pageSize, total);
                pageData = allData.slice(start, end);
            }

            let archImageData = null;
            if (isArch && tabData) archImageData = tabData.imageData || null;

            let html = `
                <div class="page-header">
                    <div class="title-group">
                        <button class="back-link" onclick="renderSystemList()"><i class="fas fa-arrow-left"></i> 返回系统列表</button>
                        <h1 style="margin-top:8px;">${sys.name} <span style="font-size:16px;font-weight:400;color:var(--text-light);">${sys.code}</span></h1>
                        <div class="sub" style="margin-top:2px;">
                            <span class="sys-status ${getStatusClass(sys.status)}" style="font-size:12px;">${sys.status}</span>
                            <span style="margin-left:12px;"><i class="fas fa-tag"></i> ${sys.domain}</span>
                            <span style="margin-left:12px;"><i class="fas fa-user"></i> ${sys.owner}</span>
                            <span style="margin-left:12px;"><i class="fas fa-calendar-alt"></i> ${sys.createdAt}</span>
                        </div>
                    </div>
                    <div class="action-bar">
                        <button class="btn btn-export" onclick="handleExportFullSystem('${sys.id}')"><i class="fas fa-file-download"></i> 导出全部技术信息</button>
                    </div>
                </div>

                <div class="tabs-container">
                    ${TABS.map((t, i) => `
                        <button class="tab-btn ${i === tabIndex ? 'active' : ''}" onclick="renderSystemDetail('${sys.id}', ${i}, 1)">
                            ${t.label}
                        </button>
                    `).join('')}
                </div>

            if (isArch) {

                const archKey = tab.key;
                const hasImage = !!archImageData;

                html += `
                    <div class="arch-card">
                        <div class="arch-header">
                            <div class="arch-title"><i class="fas fa-image"></i> ${archName}</div>
                            <span class="arch-meta"><i class="far fa-clock"></i> 最后更新：${hasImage ? '刚刚' : '暂无'}</span>
                        </div>
                        <div class="upload-area" id="archUploadArea_${archKey}">
                            <i class="fas fa-cloud-upload-alt upload-icon"></i>
                            <div class="upload-title">点击或拖拽上传图片</div>
                            <div class="upload-hint">支持 JPG、PNG、SVG 格式</div>
                            <div class="upload-formats"><i class="fas fa-image"></i> 建议比例 16:9</div>
                            <i class="fas fa-arrow-right upload-arrow"></i>
                            <input type="file" accept="image/*" style="display:none;" class="arch-file-input" data-system="${sys.id}" data-tab="${archKey}">
                        </div>
                        <div class="image-preview ${hasImage ? 'show' : ''}" id="archPreview_${archKey}">
                            ${hasImage ? `<img src="${archImageData}" alt="${archName}" />` : ''}
                            <div class="image-actions">
                                ${hasImage ? `
                                    <button class="btn btn-view" onclick="window.open('${archImageData}', '_blank')"><i class="fas fa-expand"></i> 查看大图</button>
                                    <button class="btn btn-replace arch-replace-btn" data-system="${sys.id}" data-tab="${archKey}"><i class="fas fa-sync-alt"></i> 替换图片</button>
                                    <button class="btn btn-remove arch-remove-btn" data-system="${sys.id}" data-tab="${archKey}"><i class="fas fa-trash"></i> 删除</button>
                                ` : ''}
                            </div>
                        </div>
                        <div class="empty-state" id="archEmpty_${archKey}" style="${hasImage ? 'display:none;' : ''}">
                            <i class="fas fa-image"></i>
                            暂无图片，请点击上方区域上传
                        </div>
                    </div>
                `;

                setTimeout(() => bindArchEvents(sys.id, archKey), 50);
            } else {
                // 普通表格
                // 部署信息：只显示精简 10 列
                let displayFields = fields;
                let displayIndices = fields.map((_, i) => i);
                if (isDeploy) {
                    displayFields = DEPLOY_TABLE_COLS;
                    displayIndices = DEPLOY_TABLE_COLS.map(name => fields.indexOf(name));
                }

                html += `
                    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:10px;">
                        <span style="font-size:14px;color:var(--text-secondary);">共 <strong>${total}</strong> 条记录</span>
                        <div class="action-bar" style="gap:8px;">
                            <button class="btn btn-primary" onclick="handleAddRow('${sys.id}', '${tab.key}')" style="padding:6px 16px;font-size:13px;">
                                <i class="fas fa-plus"></i> 新增
                            </button>
                            <button class="btn btn-success" onclick="handleImportTab('${sys.id}', '${tab.key}')" style="padding:6px 16px;font-size:13px;">
                                <i class="fas fa-file-upload"></i> 导入 ${tab.label}
                            </button>
                            <button class="btn btn-export" onclick="handleExportTab('${sys.id}', '${tab.key}')" style="padding:6px 16px;font-size:13px;">
                                <i class="fas fa-file-download"></i> 导出 ${tab.label}
                            </button>
                        </div>
                    </div>
                `;

                if (isDeploy) {
                    html += `<div class="table-hint"><i class="fas fa-info-circle"></i> 当前显示 10 个核心字段，完整 32 个字段请点击「查看详情」或「导出」</div>`;
                }

                html += `
                    <div class="table-wrapper">
                        <div class="table-scroll">
                            <table>
                                <thead><tr>
                                    ${displayFields.map(f => `<th>${f}</th>`).join('')}
                                    <th style="min-width:120px;">操作</th>
                                </tr></thead>
                                <tbody>
                `;

                if (pageData.length === 0) {
                    html += `<tr><td colspan="${displayFields.length+1}" style="text-align:center;padding:40px;color:var(--text-light);">暂无数据</td></tr>`;
                } else {
                    pageData.forEach((row, idx) => {
                        const realIdx = start + idx;
                        html += `<tr>`;
                        displayIndices.forEach((ci) => {
                            const fieldName = fields[ci];
                            let val = row[ci] !== undefined && row[ci] !== '' ? row[ci] : '/';
                            if (fieldName === '系统环境' || fieldName === '环境') {
                                const cls = val === '生产' ? 'env-prod' : val === '测试' ? 'env-test' : val === '开发' ? 'env-dev' : '';
                                val = `<span class="tag ${cls}">${val}</span>`;
                            }
                            html += `<td><span class="text-ellipsis" title="${escapeHtml(val)}">${val}</span></td>`;
                        });
                        html += `
                            <td>
                                <div class="action-group">
                                    ${isDeploy ? `<button class="btn-icon view" onclick="handleViewRow('${sys.id}', '${tab.key}', ${realIdx})" title="查看详情"><i class="fas fa-eye"></i></button>` : ''}
                                    <button class="btn-icon edit" onclick="handleEditRow('${sys.id}', '${tab.key}', ${realIdx})" title="编辑"><i class="fas fa-pen"></i></button>
                                    <button class="btn-icon delete" onclick="handleDeleteRow('${sys.id}', '${tab.key}', ${realIdx})" title="删除"><i class="fas fa-trash"></i></button>
                                </div>
                            </td>
                        `;
                        html += `</tr>`;
                    });
                }

                html += `
                                </tbody>
                            </table>
                        </div>
                        <div class="table-footer">
                            <span>显示 ${total > 0 ? start+1 : 0} - ${end} 条，共 ${total} 条</span>
                            <div class="pagination">
                                <button onclick="renderSystemDetail('${sys.id}', ${tabIndex}, ${currentTablePage-1})" ${currentTablePage<=1?'disabled':''}><i class="fas fa-chevron-left"></i></button>
                                ${Array.from({length: totalPages}, (_, i) => i+1).map(p =>
                                    `<button class="${p===currentTablePage?'active':''}" onclick="renderSystemDetail('${sys.id}', ${tabIndex}, ${p})">${p}</button>`
                                ).join('')}
                                <button onclick="renderSystemDetail('${sys.id}', ${tabIndex}, ${currentTablePage+1})" ${currentTablePage>=totalPages?'disabled':''}><i class="fas fa-chevron-right"></i></button>
                            </div>
                        </div>
                    </div>
                `;
            }

            pageContent.innerHTML = html;
            sidebar.classList.remove('open');
        }

        // ============================================================
        // 架构图事件绑定
        // ============================================================
        function bindArchEvents(sysId, archKey) {
            const uploadArea = document.getElementById(`archUploadArea_${archKey}`);
            if (uploadArea) {
                const fileInput = uploadArea.querySelector('.arch-file-input');
                const newInput = fileInput.cloneNode(true);
                fileInput.parentNode.replaceChild(newInput, fileInput);

                uploadArea.addEventListener('click', function(e) {
                    if (e.target.closest('.image-actions')) return;
                    const input = this.querySelector('.arch-file-input');
                    if (input) input.click();
                });
                uploadArea.addEventListener('dragover', function(e) { e.preventDefault(); this.classList.add('dragover'); });
                uploadArea.addEventListener('dragleave', function(e) { e.preventDefault(); this.classList.remove('dragover'); });
                uploadArea.addEventListener('drop', function(e) {
                    e.preventDefault();
                    this.classList.remove('dragover');
                    const files = e.dataTransfer.files;
                    if (files && files.length > 0) {
                        const input = this.querySelector('.arch-file-input');
                        if (input) { input.files = files; handleArchFileUpload(input, sysId, archKey); }
                    }
                });
                const input = uploadArea.querySelector('.arch-file-input');
                if (input) {
                    input.addEventListener('change', function() {
                        if (this.files && this.files.length > 0) handleArchFileUpload(this, sysId, archKey);
                    });
                }
            }
            document.querySelectorAll('.arch-replace-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const tKey = this.dataset.tab;
                    const area = document.getElementById(`archUploadArea_${tKey}`);
                    if (area) {
                        const input = area.querySelector('.arch-file-input');
                        if (input) input.click();
                    }
                });
            });
            document.querySelectorAll('.arch-remove-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    handleArchRemove(this.dataset.system, this.dataset.tab);
                });
            });
        }

        function handleArchFileUpload(input, systemId, tabKey) {
            const file = input.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) { showToast('请上传图片文件', 'error'); input.value = ''; return; }
            if (file.size > 5 * 1024 * 1024) { showToast('图片大小不能超过 5MB', 'error'); input.value = ''; return; }

            const reader = new FileReader();
            reader.onload = function(e) {
                const sys = getSystemById(systemId);
                if (sys && sys.techData[tabKey]) sys.techData[tabKey].imageData = e.target.result;
                renderSystemDetail(systemId, currentTabIndex, currentTablePage);
                showToast('架构图上传成功 ✅', 'success');
            };
            reader.readAsDataURL(file);
        }

        function handleArchRemove(systemId, tabKey) {
            const sys = getSystemById(systemId);
            if (!sys) return;
            const tabData = sys.techData[tabKey];
            if (!tabData || !tabData.imageData) { showToast('暂无图片可删除', 'error'); return; }

            openModal(`
                <div class="modal-header">
                    <h3><i class="fas fa-trash-alt" style="color:#dc3545;margin-right:8px;"></i>删除确认</h3>
                    <button class="close" onclick="closeModal()">&times;</button>
                </div>
                <div class="modal-body" style="text-align:center;padding:32px 24px;">
                    <i class="fas fa-exclamation-triangle" style="font-size:48px;color:#dc3545;margin-bottom:16px;"></i>
                    <p>确定要删除 <span class="highlight">"${TABS.find(t => t.key === tabKey)?.label || '架构图'}"</span> 吗？</p>
                </div>
                <div class="modal-footer" style="justify-content:center;">
                    <button class="btn btn-secondary" onclick="closeModal()">取消</button>
                    <button class="btn btn-danger" onclick="confirmArchRemove('${systemId}', '${tabKey}')"><i class="fas fa-check"></i> 确定删除</button>
                </div>
            `);
        }

        function confirmArchRemove(systemId, tabKey) {
            const sys = getSystemById(systemId);
            if (sys && sys.techData[tabKey]) sys.techData[tabKey].imageData = null;
            closeModal();
            renderSystemDetail(systemId, currentTabIndex, currentTablePage);
            showToast('架构图已删除', 'success');
        }

        // ============================================================
        // 详情抽屉（用于部署信息查看完整字段）
        // ============================================================
        function handleViewRow(systemId, tabKey, rowIndex) {
            const sys = getSystemById(systemId);
            if (!sys) return;
            const tabData = sys.techData[tabKey];
            if (!tabData) return;
            const row = tabData.data[rowIndex];
            if (!row) return;
            const fields = tabData.fields;
            const tabLabel = TABS.find(t => t.key === tabKey)?.label || '';

            // 只有部署信息用分组展示
            if (tabKey === 'deploy') {
                let bodyHtml = '';
                DEPLOY_GROUPS.forEach((group, gi) => {
                    const isOpen = gi === 0;
                    bodyHtml += `
                        <div class="detail-section">
                            <div class="detail-section-header ${isOpen?'open':''}" onclick="toggleDetailSection(this)">
                                <span><i class="fas ${group.icon}" style="color:var(--primary);margin-right:8px;"></i>${group.name} <span class="count">(${group.fields.length}项)</span></span>
                                <i class="fas fa-chevron-right arrow"></i>
                            </div>
                            <div class="detail-section-body ${isOpen?'open':''}">
                                ${group.fields.map(f => {
                                    const idx = fields.indexOf(f);
                                    const val = idx >= 0 && row[idx] !== undefined && row[idx] !== '' ? row[idx] : '/';
                                    return `<div class="detail-row"><span class="label">${f}</span><span class="value">${escapeHtml(val)}</span></div>`;
                                }).join('')}
                            </div>
                        </div>
                    `;
                });

                openDrawer(`
                    <div class="drawer-header">
                        <h3><i class="fas fa-info-circle"></i> ${tabLabel} · 详情</h3>
                        <button class="close" onclick="closeDrawer()">&times;</button>
                    </div>
                    <div class="drawer-body">${bodyHtml}</div>
                `);
            } else {
                // 其他 Tab 直接用简单详情
                let bodyHtml = `<div class="detail-section"><div class="detail-section-body open">`;
                fields.forEach((f, i) => {
                    const val = row[i] !== undefined && row[i] !== '' ? row[i] : '/';
                    bodyHtml += `<div class="detail-row"><span class="label">${f}</span><span class="value">${escapeHtml(val)}</span></div>`;
                });
                bodyHtml += `</div></div>`;
                openDrawer(`
                    <div class="drawer-header">
                        <h3><i class="fas fa-info-circle"></i> ${tabLabel} · 详情</h3>
                        <button class="close" onclick="closeDrawer()">&times;</button>
                    </div>
                    <div class="drawer-body">${bodyHtml}</div>
                `);
            }
        }

        function toggleDetailSection(header) {
            header.classList.toggle('open');
            const body = header.nextElementSibling;
            body.classList.toggle('open');
        }

        // ============================================================
        // 导航
        // ============================================================
        function navigateToSystem(systemId) { renderSystemDetail(systemId, 0, 1); }

        sidebarLinks.forEach(a => {
            a.addEventListener('click', (e) => {
                e.preventDefault();
                renderSystemList();
                if (window.innerWidth <= 992) sidebar.classList.remove('open');
            });
        });
        hamburgerBtn.addEventListener('click', () => sidebar.classList.toggle('open'));

        // ============================================================
        // 系统列表 CRUD
        // ============================================================
        function resetSystemFilters() {
            const inp = document.getElementById('sysSearchInput');
            const domain = document.getElementById('sysDomainFilter');
            const status = document.getElementById('sysStatusFilter');
            if (inp) inp.value = '';
            if (domain) domain.value = '';
            if (status) status.value = '';
            renderSystemList();
        }

            openModal(`

                                <option value="已下线">已下线</option>
                                <option value="维护中">维护中</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" onclick="closeModal()">取消</button>
                    <button class="btn btn-primary" onclick="submitAddSystem()"><i class="fas fa-save"></i> 保存</button>
                </div>
            `);
        }

        function submitAddSystem() {
            const code = document.getElementById('newSysCode').value.trim();
            const name = document.getElementById('newSysName').value.trim();
            const domain = document.getElementById('newSysDomain').value;
            const owner = document.getElementById('newSysOwner').value.trim();
            const status = document.getElementById('newSysStatus').value;

            if (!code || !name || !owner) { showToast('请填写完整信息', 'error'); return; }
            if (systems.some(s => s.code === code)) { showToast('系统编码已存在', 'error'); return; }

            systems.push({
                id: 'sys-' + Date.now(),
                code, name, domain, owner, status,
                createdAt: new Date().toISOString().slice(0, 10),
                techData: createDefaultTechData()
            });
            closeModal();
            renderSystemList();
            showToast(`系统 "${name}" 创建成功`, 'success');
        }

        function handleEditSystem(systemId) {
            const sys = getSystemById(systemId);
            if (!sys) return;
            openModal(`
                <div class="modal-header">
                    <h3><i class="fas fa-edit" style="color:var(--primary);margin-right:8px;"></i>编辑系统</h3>
                    <button class="close" onclick="closeModal()">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="form-grid">
                        <div class="form-group"><label>系统编码</label><input type="text" value="${sys.code}" disabled style="background:var(--bg-main);"></div>
                        <div class="form-group"><label>系统名称 <span class="required">*</span></label><input type="text" id="editSysName" value="${escapeHtml(sys.name)}"></div>
                        <div class="form-group">
                            <label>所属业务域 <span class="required">*</span></label>
                            <select id="editSysDomain">
                                <option value="基础服务" ${sys.domain==='基础服务'?'selected':''}>基础服务</option>
                                <option value="交易域" ${sys.domain==='交易域'?'selected':''}>交易域</option>
                                <option value="运维域" ${sys.domain==='运维域'?'selected':''}>运维域</option>
                                <option value="数据域" ${sys.domain==='数据域'?'selected':''}>数据域</option>
                            </select>
                        </div>
                        <div class="form-group"><label>负责人 <span class="required">*</span></label><input type="text" id="editSysOwner" value="${escapeHtml(sys.owner)}"></div>
                        <div class="form-group full">
                            <label>状态 <span class="required">*</span></label>
                            <select id="editSysStatus">
                                <option value="在建" ${sys.status==='在建'?'selected':''}>在建</option>
                                <option value="已上线" ${sys.status==='已上线'?'selected':''}>已上线</option>
                                <option value="已下线" ${sys.status==='已下线'?'selected':''}>已下线</option>
                                <option value="维护中" ${sys.status==='维护中'?'selected':''}>维护中</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" onclick="closeModal()">取消</button>
                    <button class="btn btn-primary" onclick="submitEditSystem('${sys.id}')"><i class="fas fa-save"></i> 更新</button>
                </div>
            `);
        }

        function submitEditSystem(systemId) {
            const sys = getSystemById(systemId);
            if (!sys) return;
            const name = document.getElementById('editSysName').value.trim();
            const domain = document.getElementById('editSysDomain').value;
            const owner = document.getElementById('editSysOwner').value.trim();
            const status = document.getElementById('editSysStatus').value;
            if (!name || !owner) { showToast('请填写完整信息', 'error'); return; }
            sys.name = name; sys.domain = domain; sys.owner = owner; sys.status = status;
            closeModal(); renderSystemList();
            showToast(`系统 "${name}" 更新成功`, 'success');
        }

        function handleDeleteSystem(systemId) {
            const sys = getSystemById(systemId);
            if (!sys) return;
            openModal(`
                <div class="modal-header">
                    <h3><i class="fas fa-trash-alt" style="color:#dc3545;margin-right:8px;"></i>删除确认</h3>
                    <button class="close" onclick="closeModal()">&times;</button>
                </div>
                <div class="modal-body" style="text-align:center;padding:32px 24px;">
                    <i class="fas fa-exclamation-triangle" style="font-size:48px;color:#dc3545;margin-bottom:16px;"></i>
                    <p>确定要删除系统 <span class="highlight">"${sys.name} (${sys.code})"</span> 吗？</p>
                    <p style="font-size:13px;color:var(--text-light);margin-top:4px;">该操作将同时删除该系统全部技术信息，不可恢复</p>
                </div>
                <div class="modal-footer" style="justify-content:center;">
                    <button class="btn btn-secondary" onclick="closeModal()">取消</button>
                    <button class="btn btn-danger" onclick="confirmDeleteSystem('${sys.id}')"><i class="fas fa-check"></i> 确定删除</button>
                </div>
            `);
        }

        function confirmDeleteSystem(systemId) {
            const idx = systems.findIndex(s => s.id === systemId);
            if (idx > -1) systems.splice(idx, 1);
            closeModal(); renderSystemList();
            showToast('系统已删除', 'success');
        }

        // ============================================================
        // 系统列表 导入/导出
        // ============================================================
        function handleImportSystems() {
            openModal(`
                <div class="modal-header">
                    <h3><i class="fas fa-file-upload" style="color:var(--primary);margin-right:8px;"></i>导入系统</h3>
                    <button class="close" onclick="closeModal()">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="upload-zone" id="sysImportZone">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <p><strong>点击或拖拽上传 Excel 文件</strong></p>
                        <div style="font-size:12px;color:var(--text-light);margin-top:4px;">支持 .xlsx, .xls 格式</div>
                        <div style="font-size:12px;color:var(--text-light);">字段：系统编码、系统名称、所属业务域、负责人、状态</div>
                        <input type="file" accept=".xlsx,.xls" style="display:none;" id="sysImportInput" onchange="handleSysImportFile(event)">
                        <div class="file-name" id="sysImportFileName"></div>
                    </div>
                    <div id="sysImportPreview" style="margin-top:16px;display:none;">
                        <p style="font-weight:500;color:var(--primary);"><i class="fas fa-check-circle"></i> 文件解析成功，共 3 条数据待导入</p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" onclick="closeModal()">取消</button>
                    <button class="btn btn-success" id="sysImportConfirm" onclick="confirmSysImport()" disabled><i class="fas fa-upload"></i> 确认导入</button>
                </div>
            `);
            const zone = document.getElementById('sysImportZone');
            const input = document.getElementById('sysImportInput');
            zone.addEventListener('click', () => input.click());
            zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.style.borderColor = 'var(--primary)'; });
            zone.addEventListener('dragleave', () => { zone.style.borderColor = ''; });
            zone.addEventListener('drop', (e) => {
                e.preventDefault(); zone.style.borderColor = '';
                if (e.dataTransfer.files.length) { input.files = e.dataTransfer.files; handleSysImportFile({ target: input }); }
            });
        }

        function handleSysImportFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('sysImportFileName').textContent = file.name;
            document.getElementById('sysImportPreview').style.display = 'block';
            document.getElementById('sysImportConfirm').disabled = false;
            showToast('文件解析成功', 'success');
        }

        function confirmSysImport() {
            const samples = [
                { code: 'SYS-005', name: '消息中心', domain: '基础服务', owner: '刘七', status: '在建' },
                { code: 'SYS-006', name: '报表平台', domain: '数据域', owner: '陈八', status: '已上线' },
                { code: 'SYS-007', name: '监控平台', domain: '运维域', owner: '杨九', status: '维护中' }
            ];
            samples.forEach(s => {
                systems.push({
                    id: 'sys-' + Date.now() + Math.random().toString(36).slice(2, 6),
                    code: s.code, name: s.name, domain: s.domain, owner: s.owner, status: s.status,
                    createdAt: new Date().toISOString().slice(0, 10),
                    techData: createDefaultTechData()
                });
            });
            closeModal(); renderSystemList();
            showToast('成功导入 3 个系统', 'success');
        }

        function handleExportSystems() {
            let csv = '系统编码,系统名称,所属业务域,负责人,状态,创建时间\n';
            systems.forEach(s => { csv += `${s.code},${s.name},${s.domain},${s.owner},${s.status},${s.createdAt}\n`; });
            downloadCsv(csv, '系统列表.csv');
            showToast('系统列表导出成功', 'success');
        }

        function downloadCsv(content, filename) {
            const blob = new Blob(['\uFEFF' + content], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
        }

        // ============================================================
        // 系统详情 — 行操作
        // ============================================================
        function getTabData(systemId, tabKey) {
            const sys = getSystemById(systemId);
            if (!sys) return null;
            return sys.techData[tabKey] || null;
        }

        // 生成字段表单（部署信息用分组排版）
        function buildFormHtml(fields, row, tabKey) {
            if (tabKey === 'deploy') {
                let html = '';
                DEPLOY_GROUPS.forEach(group => {
                    html += `<div class="form-section-title"><i class="fas ${group.icon}"></i> ${group.name}</div>`;
                    html += `<div class="form-grid">`;
                    group.fields.forEach(f => {
                        const idx = fields.indexOf(f);
                        const val = row && row[idx] !== undefined ? row[idx] : '';
                        html += `
                            <div class="form-group">
                                <label>${f}</label>
                                <input type="text" id="rowField_${idx}" value="${escapeHtml(val)}" placeholder="请输入${f}">
                            </div>
                        `;
                    });
                    html += `</div>`;
                });
                return html;
            } else {
                let html = `<div class="form-grid">`;
                fields.forEach((f, i) => {
                    const val = row && row[i] !== undefined ? row[i] : '';
                    html += `
                        <div class="form-group ${i===0?'full':''}">
                            <label>${f}</label>
                            <input type="text" id="rowField_${i}" value="${escapeHtml(val)}" placeholder="请输入${f}">
                        </div>
                    `;
                });
                html += `</div>`;
                return html;
            }
        }

        function handleAddRow(systemId, tabKey) {
            const tabData = getTabData(systemId, tabKey);
            if (!tabData || tabData.isArch) return;
            const fields = tabData.fields;
            const formHtml = buildFormHtml(fields, null, tabKey);
            const tabLabel = TABS.find(t => t.key === tabKey)?.label || '';
            const large = tabKey === 'deploy';

            openModal(`
                <div class="modal-header">
                    <h3><i class="fas fa-plus-circle" style="color:var(--primary);margin-right:8px;"></i>新增 ${tabLabel}</h3>
                    <button class="close" onclick="closeModal()">&times;</button>
                </div>
                <div class="modal-body">${formHtml}</div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" onclick="closeModal()">取消</button>
                    <button class="btn btn-primary" onclick="submitAddRow('${systemId}', '${tabKey}')"><i class="fas fa-save"></i> 保存</button>
                </div>
            `, large);
        }

        function submitAddRow(systemId, tabKey) {
            const tabData = getTabData(systemId, tabKey);
            if (!tabData) return;
            const fields = tabData.fields;
            const newRow = fields.map((_, i) => {
                const el = document.getElementById(`rowField_${i}`);
                return el ? el.value.trim() || '/' : '/';
            });
            tabData.data.push(newRow);
            closeModal();
            renderSystemDetail(systemId, currentTabIndex, currentTablePage);
            showToast('新增成功', 'success');
        }

        function handleEditRow(systemId, tabKey, rowIndex) {
            const tabData = getTabData(systemId, tabKey);
            if (!tabData || tabData.isArch) return;
            const fields = tabData.fields;
            const row = tabData.data[rowIndex];
            if (!row) return;
            const formHtml = buildFormHtml(fields, row, tabKey);
            const tabLabel = TABS.find(t => t.key === tabKey)?.label || '';
            const large = tabKey === 'deploy';

            openModal(`
                <div class="modal-header">
                    <h3><i class="fas fa-edit" style="color:var(--primary);margin-right:8px;"></i>编辑 ${tabLabel}</h3>
                    <button class="close" onclick="closeModal()">&times;</button>
                </div>
                <div class="modal-body">${formHtml}</div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" onclick="closeModal()">取消</button>
                    <button class="btn btn-primary" onclick="submitEditRow('${systemId}', '${tabKey}', ${rowIndex})"><i class="fas fa-save"></i> 更新</button>
                </div>
            `, large);
        }

        function submitEditRow(systemId, tabKey, rowIndex) {
            const tabData = getTabData(systemId, tabKey);
            if (!tabData) return;
            const fields = tabData.fields;
            const newRow = fields.map((_, i) => {
                const el = document.getElementById(`rowField_${i}`);
                return el ? el.value.trim() || '/' : '/';
            });
            tabData.data[rowIndex] = newRow;
            closeModal();
            renderSystemDetail(systemId, currentTabIndex, currentTablePage);
            showToast('更新成功', 'success');
        }

        function handleDeleteRow(systemId, tabKey, rowIndex) {
            const tabData = getTabData(systemId, tabKey);
            if (!tabData || tabData.isArch) return;
            const row = tabData.data[rowIndex];
            const name = row && row[1] ? row[1] : (row && row[0] ? row[0] : '这条记录');

            openModal(`
                <div class="modal-header">
                    <h3><i class="fas fa-trash-alt" style="color:#dc3545;margin-right:8px;"></i>删除确认</h3>
                    <button class="close" onclick="closeModal()">&times;</button>
                </div>
                <div class="modal-body" style="text-align:center;padding:32px 24px;">
                    <i class="fas fa-exclamation-triangle" style="font-size:48px;color:#dc3545;margin-bottom:16px;"></i>
                    <p>确定要删除 <span class="highlight">"${name}"</span> 吗？</p>
                </div>
                <div class="modal-footer" style="justify-content:center;">
                    <button class="btn btn-secondary" onclick="closeModal()">取消</button>
                    <button class="btn btn-danger" onclick="confirmDeleteRow('${systemId}', '${tabKey}', ${rowIndex})"><i class="fas fa-check"></i> 确定删除</button>
                </div>
            `);
        }

        function confirmDeleteRow(systemId, tabKey, rowIndex) {
            const tabData = getTabData(systemId, tabKey);
            if (!tabData) return;
            tabData.data.splice(rowIndex, 1);
            closeModal();
            renderSystemDetail(systemId, currentTabIndex, currentTablePage);
            showToast('删除成功', 'success');
        }

        // ============================================================
        // 系统详情 — Tab 导入/导出（全字段）
        // ============================================================
        function handleImportTab(systemId, tabKey) {
            const sys = getSystemById(systemId);
            if (!sys) return;
            const tabData = sys.techData[tabKey];
            if (!tabData || tabData.isArch) return;
            const tabLabel = TABS.find(t => t.key === tabKey)?.label || '';
            const fieldCount = tabData.fields.length;

            openModal(`
                <div class="modal-header">
                    <h3><i class="fas fa-file-upload" style="color:var(--primary);margin-right:8px;"></i>导入 ${tabLabel}</h3>
                    <button class="close" onclick="closeModal()">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="upload-zone" id="tabImportZone">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <p><strong>点击或拖拽上传 Excel 文件</strong></p>
                        <div style="font-size:12px;color:var(--text-light);margin-top:4px;">支持 .xlsx, .xls 格式</div>
                        <div style="font-size:12px;color:var(--text-light);">模板包含全部 <strong>${fieldCount}</strong> 个字段</div>
                        <input type="file" accept=".xlsx,.xls" style="display:none;" id="tabImportInput" onchange="handleTabImportFile(event)">
                        <div class="file-name" id="tabImportFileName"></div>
                    </div>
                    <div id="tabImportPreview" style="margin-top:16px;display:none;">
                        <p style="font-weight:500;color:var(--primary);"><i class="fas fa-check-circle"></i> 文件解析成功，数据校验通过</p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" onclick="closeModal()">取消</button>
                    <button class="btn btn-success" id="tabImportConfirm" onclick="confirmTabImport('${systemId}', '${tabKey}')" disabled><i class="fas fa-upload"></i> 确认导入</button>
                </div>
            `);
            const zone = document.getElementById('tabImportZone');
            const input = document.getElementById('tabImportInput');
            zone.addEventListener('click', () => input.click());
            zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.style.borderColor = 'var(--primary)'; });
            zone.addEventListener('dragleave', () => { zone.style.borderColor = ''; });
            zone.addEventListener('drop', (e) => {
                e.preventDefault(); zone.style.borderColor = '';
                if (e.dataTransfer.files.length) { input.files = e.dataTransfer.files; handleTabImportFile({ target: input }); }
            });
        }

        function handleTabImportFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('tabImportFileName').textContent = file.name;
            document.getElementById('tabImportPreview').style.display = 'block';
            document.getElementById('tabImportConfirm').disabled = false;
            showToast('文件解析成功', 'success');
        }

        function confirmTabImport(systemId, tabKey) {
            const tabData = getTabData(systemId, tabKey);
            if (!tabData) return;
            const fields = tabData.fields;
            const sample = fields.map((_, i) => `导入数据${i+1}`);
            tabData.data.push(sample);
            tabData.data.push(sample.map((_, i) => `导入数据${i+1}-v2`));
            closeModal();
            renderSystemDetail(systemId, currentTabIndex, currentTablePage);
            showToast('导入成功', 'success');
        }

        function handleExportTab(systemId, tabKey) {
            const tabData = getTabData(systemId, tabKey);
            if (!tabData || tabData.isArch) { showToast('该类型不支持导出', 'error'); return; }
            const tabLabel = TABS.find(t => t.key === tabKey)?.label || '';
            // 导出全字段
            let csv = tabData.fields.map(f => `"${f}"`).join(',') + '\n';
            tabData.data.forEach(row => {
                csv += row.map(c => `"${(c || '').toString().replace(/"/g, '""')}"`).join(',') + '\n';
            });
            downloadCsv(csv, `${tabLabel}.csv`);
            showToast(`${tabLabel} 导出成功（含全部 ${tabData.fields.length} 个字段）`, 'success');
        }

        function handleExportFullSystem(systemId) {
            const sys = getSystemById(systemId);
            if (!sys) return;
            showToast(`正在导出 ${sys.name} 全部技术信息（15 个维度）...`, 'success');
            setTimeout(() => { showToast(`${sys.name} 全部技术信息导出成功`, 'success'); }, 800);
        }

        // ============================================================
        // 初始化
        // ============================================================
        renderSystemList();
    </script>

</body>
</html>
